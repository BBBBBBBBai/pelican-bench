<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <title>Pelican icon</title>
  <defs>
    <filter id="pouchGlow" filterUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="32.0"/>
    </filter>
    <!-- 辉光方向性: 沿喉囊上缘斜边方向的渐变 (上缘外侧=0, 越往下越满) -->
    <linearGradient id="glowRamp" gradientUnits="userSpaceOnUse"
                    x1="500.000" y1="568.838" x2="515.461" y2="611.099">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="glowMask" mask-type="alpha"
          maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254">
      <rect width="1254" height="1254" fill="url(#glowRamp)"/>
    </mask>
    <!-- 喉囊右上前缘外侧的辉光切除 (半平面渐变, 外侧 0 → 内侧 1) -->
    <linearGradient id="glowCut" gradientUnits="userSpaceOnUse"
                    x1="760.569" y1="480.288" x2="739.154" y2="501.298">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="cutMask" mask-type="alpha"
          maskUnits="userSpaceOnUse" x="0" y="0" width="1254" height="1254">
      <rect width="1254" height="1254" fill="url(#glowCut)"/>
    </mask>
  </defs>

  <!-- 1. 底板 -->
  <rect width="1254" height="1254" fill="#000000"/>
  <rect width="1254" height="1254" rx="204" ry="204" fill="#151412"/>

  <!-- 2. 内框细描边 (实测: 左70.15 右1183.4 上72.05 下1173.5, 圆角≈124) -->
  <rect x="70.15" y="72.05" width="1113.25" height="1101.45" rx="124" ry="124"
        fill="none" stroke="#2A2722" stroke-width="12.6"/>

  <!-- 3. 两个 L 角标 -->
  <g fill="none" stroke="#302D27" stroke-width="11" stroke-linecap="butt">
    <path d="M131 190 L131 131 L190 131"/>
    <path d="M1123 1064 L1123 1123 L1064 1123"/>
  </g>

