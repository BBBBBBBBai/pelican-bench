<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover`：不开的话 `env(safe-area-inset-bottom)` 恒为 0，
         手机底部那条横条会压住贴底的东西（回执、悬浮提示、最后的输入框）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>鹈鹕测试台 · Pelican Bench</title>
    <!-- 图标由 assets/make-icons.mjs 从 assets/pelican-logo.svg 生成。
         SVG 版在前：能读 SVG 的浏览器会挑它，标签页里更锐利；
         .ico 是回落（也给 Windows 的开始菜单 / 任务栏用，exe 里嵌的是同一份）。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#151412" />
    <!-- 两套字都躺在本地，但原来要等 CSS 解析完、再等一轮字体请求才到手，
         首屏是拿系统字体画的，换字体时整块面板重排一次。
         这两个文件是这台仪器的声音，先要它们。 -->
    <link
      rel="preload"
      href="/src/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/fonts/azeret-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
