<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover`：不开的话 `env(safe-area-inset-bottom)` 恒为 0，
         手机底部那条横条会压住贴底的东西（回执、悬浮提示、最后的输入框）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>鹈鹕测试台 · Pelican Bench</title>
    <!-- 两套字都躺在本地，但原来要等 CSS 解析完、再等一轮字体请求才到手，
         首屏是拿系统字体画的，换字体时整块面板重排一次。
         这两个文件是这台仪器的声音，先要它们。 -->
    <link
      rel="preload"
      href="/src/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/fonts/azeret-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
